<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .exercise-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .exercise-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 900px;
            margin: 0 auto 40px;
        }

        .exercise-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
        .exercise-meta { display: flex; gap: 16px; margin-bottom: 24px; font-size: 0.9rem; flex-wrap: wrap; }
        .meta-item { display: flex; align-items: center; gap: 6px; }
        .difficulty-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .difficulty-badge.easy { background: #d4edda; color: #155724; }
        .difficulty-badge.medium { background: #fff3cd; color: #856404; }
        .difficulty-badge.hard { background: #f8d7da; color: #721c24; }

        .instructions { background: #f0f4ff; padding: 16px; border-radius: 8px; margin-bottom: 24px; line-height: 1.6; }
        .prompt { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 24px; font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }

        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: 600; margin-bottom: 8px; display: block; }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 8px 12px;
            background: #f0f4ff;
            border-radius: 6px;
            width: fit-content;
        }
        .timer.warning { color: #ff9800; background: #fff3cd; }
        .timer.danger { color: #f44336; background: #f8d7da; }

        .submit-btn {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .submit-btn:hover { background: #5568d3; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

        .results-message {
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .results-message.show { display: block; }
        .results-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .results-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .score-display {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .score-display.show { display: block; }
        .score-big { font-size: 2.5rem; font-weight: 700; color: #667eea; }
        .score-label { color: #666; font-size: 0.9rem; }

        .loading { text-align: center; padding: 40px; color: #999; }
        .error { background: #f8d7da; color: #721c24; padding: 16px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="exercise-header">
    <div class="container">
        <button class="back-btn" onclick="history.back()">← Back</button>
    </div>
</div>

<div class="container">
    <div id="exerciseContainer" class="loading">Loading exercise...</div>
</div>

<script src="js/dojo-client.js?v=1.0"></script>

<script>
let EXERCISES_MAP = {};

async function loadExercisesMap() {
    try {
        const response = await fetch('/data/dojo/exercises.json');
        const exercises = await response.json();
        exercises.forEach(ex => {
            EXERCISES_MAP[ex.exercise_id] = ex;
        });
    } catch (e) {
        console.warn('⚠️ Exercises load:', e);
    }
}

(async function() {
    // Get studentId from parent window or direct
    if (!window.currentStudent && window.parent && window.parent.currentStudent) {
        window.currentStudent = window.parent.currentStudent;
    }

    const params = new URLSearchParams(window.location.search);
    const exerciseId = params.get('exercise');

    if (!exerciseId) {
        document.getElementById('exerciseContainer').innerHTML = '<div class="error">Exercise ID not found.</div>';
        return;
    }

    await dojoClient.init();
    await loadExercisesMap();

    const exercise = EXERCISES_MAP[exerciseId];

    if (!exercise) {
        document.getElementById('exerciseContainer').innerHTML = '<div class="error">Exercise not found.</div>';
        return;
    }

    let startTime = Date.now();
    let timerInterval = null;
    let submitted = false;

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        const timeLimitMs = exercise.time_limit_seconds * 1000;
        timerInterval = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const remaining = timeLimitMs - elapsed;
            const remainingSecs = Math.ceil(remaining / 1000);

            const timerEl = document.getElementById('timer');
            if (!timerEl) {
                clearInterval(timerInterval);
                return;
            }

            timerEl.textContent = formatTime(Math.max(0, remainingSecs));

            if (remainingSecs <= 60) {
                timerEl.parentElement.classList.add('warning');
            }
            if (remainingSecs <= 10) {
                timerEl.parentElement.classList.add('danger');
            }
        }, 100);
    }

    const timeMs = exercise.time_limit_seconds * 1000;
    const html = `
        <div class="exercise-container">
            <h2 class="exercise-title">${exercise.title}</h2>
            <div class="exercise-meta">
                <span class="meta-item">
                    <span class="difficulty-badge ${exercise.difficulty}">${exercise.difficulty}</span>
                </span>
                <span class="meta-item">⏱️ <span id="timer">${formatTime(exercise.time_limit_seconds)}</span></span>
                <span class="meta-item">💰 ${exercise.points_base} base pts</span>
            </div>

            <div class="instructions">${exercise.instructions}</div>

            <div class="prompt">${exercise.prompt}</div>

            <form id="exerciseForm">
                <div class="form-group">
                    <label for="answerInput">Your Answer:</label>
                    <textarea id="answerInput" placeholder="Type your response here..." required></textarea>
                    <div style="font-size: 0.85rem; color: #999; margin-top: 6px; display: flex; justify-content: space-between;">
                        <span id="charCount">0 characters</span>
                        <span id="wordCount">0 words</span>
                    </div>
                    <div id="answerValidation" style="font-size: 0.85rem; margin-top: 8px; padding: 8px; border-radius: 4px; display: none;"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Submit Answer</button>
            </form>

            <div class="results-message" id="resultsMessage"></div>
            <div class="score-display" id="scoreDisplay"></div>
        </div>
    `;

    document.getElementById('exerciseContainer').innerHTML = html;
    startTimer();

    // Real-time counter + validation
    const answerInput = document.getElementById('answerInput');
    const charCount = document.getElementById('charCount');
    const wordCount = document.getElementById('wordCount');
    const validationMsg = document.getElementById('answerValidation');

    function updateCounter() {
        const text = answerInput.value.trim();
        const chars = text.length;
        const words = text.split(/\s+/).filter(w => w.length > 0).length;

        charCount.textContent = chars + ' character' + (chars === 1 ? '' : 's');
        wordCount.textContent = words + ' word' + (words === 1 ? '' : 's');

        // Show validation feedback
        if (chars > 0 && chars < 50) {
            validationMsg.style.display = 'block';
            validationMsg.style.background = '#fff3cd';
            validationMsg.style.color = '#856404';
            validationMsg.textContent = '⚠️ Minimum 50 characters required (' + chars + '/50)';
        } else if (words > 0 && words < 10) {
            validationMsg.style.display = 'block';
            validationMsg.style.background = '#fff3cd';
            validationMsg.style.color = '#856404';
            validationMsg.textContent = '⚠️ Minimum 10 words required (' + words + '/10)';
        } else if (chars >= 50 && words >= 10) {
            validationMsg.style.display = 'block';
            validationMsg.style.background = '#d4edda';
            validationMsg.style.color = '#155724';
            validationMsg.textContent = '✅ Answer meets requirements';
        } else {
            validationMsg.style.display = 'none';
        }
    }

    answerInput.addEventListener('input', updateCounter);

    document.getElementById('exerciseForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        if (submitted) return;
        submitted = true;

        const answer = document.getElementById('answerInput').value;
        const elapsedMs = Date.now() - startTime;

        document.getElementById('submitBtn').disabled = true;

        try {
            const result = await dojoClient.submitExercise(exerciseId, answer, elapsedMs);

            if (result.error) {
                throw result;
            }

            const { points, totalPoints } = result;
            const speedBonus = elapsedMs <= (timeMs * 0.5);

            document.getElementById('resultsMessage').className = 'results-message show success';
            document.getElementById('resultsMessage').innerHTML = `
                ✅ <strong>Exercise Submitted!</strong><br>
                ${speedBonus ? '⚡ <strong>Speed Bonus Applied!</strong><br>' : ''}
                Your answer has been recorded. Keep going!
            `;

            document.getElementById('scoreDisplay').className = 'score-display show';
            document.getElementById('scoreDisplay').innerHTML = `
                <div class="score-label">Points Earned</div>
                <div class="score-big">+${points}</div>
                <div class="score-label">Total: ${totalPoints} pts</div>
            `;

            dojoClient.recordActivity();
            await dojoClient.updateStreakBadge();

            setTimeout(() => {
                history.back();
            }, 3000);

        } catch (e) {
            console.error('❌ Submit failed:', e);

            let errorMsg = 'Try again or contact support.';
            if (e.message === 'Validation failed') {
                errorMsg = e.message + ': ' + (e.message || 'Answer does not meet requirements.');
            } else if (e.offline) {
                errorMsg = 'Saved offline. Will sync when online.';
            }

            document.getElementById('resultsMessage').className = 'results-message show error';
            document.getElementById('resultsMessage').innerHTML = `
                ⚠️ <strong>Submission failed.</strong><br>
                ${errorMsg}
            `;

            document.getElementById('submitBtn').disabled = false;
            submitted = false;
        }

        clearInterval(timerInterval);
    });

})();
</script>

</body>
</html>
