<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Helper — Answers & Clues</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f1f38;
            --teal: #0891b2;
            --snow: #f6f8fb;
            --ink: #1e2d42;
            --mist: #8da0b4;
            --white: #ffffff;
            --green: #059669;
            --red: #dc2626;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--snow);
            color: var(--ink);
            margin: 0;
            padding: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .header {
            background: var(--navy);
            color: var(--white);
            padding: 12px 16px;
            margin: -20px -20px 20px -20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 16px;
            margin: 0;
        }
        .slide-info {
            font-size: 12px;
            color: var(--mist);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }
        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 14px;
            margin: 0 0 10px 0;
            color: var(--navy);
            border-bottom: 1px solid var(--snow);
            padding-bottom: 8px;
        }
        .answer-item {
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 3px solid var(--teal);
        }
        .answer-label {
            font-weight: 700;
            color: var(--teal);
            font-size: 12px;
            display: block;
        }
        .answer-value {
            font-size: 14px;
            display: block;
        }
        .explanation {
            font-size: 13px;
            color: #666;
            font-style: italic;
            margin-top: 4px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--mist);
        }
        .correct { color: var(--green); font-weight: 600; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            background: var(--teal);
            color: white;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Instructor Helper</h1>
        <span id="slideCounter" style="font-size: 12px; opacity: 0.8;">— / —</span>
    </div>

    <div id="slideInfo" class="slide-info">Waiting for selection...</div>

    <div id="content">
        <div class="empty-state">
            Navigate through the lesson to see answers and clues here.
        </div>
    </div>

    <script>
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'UPDATE_HELPER') {
                updateUI(data.payload);
            }
        });

        function updateUI(payload) {
            const { index, total, slideType, title, content, answers } = payload;
            
            document.getElementById('slideCounter').textContent = `${index + 1} / ${total}`;
            document.getElementById('slideInfo').textContent = `${slideType.replace(/_/g, ' ')} ${title ? `— ${title}` : ''}`;
            
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';

            if (!answers || answers.length === 0) {
                contentDiv.innerHTML = `
                    <div class="card">
                        <h2>Content / Information</h2>
                        <p>This slide contains information or media. No specific answers to show.</p>
                    </div>`;
                return;
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h2>Correct Answers & Explanations</h2>`;

            answers.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'answer-item';
                
                let html = '';
                if (item.label) html += `<span class="answer-label">${item.label}</span>`;
                if (item.answer) html += `<span class="answer-value">${item.answer}</span>`;
                if (item.explanation) html += `<div class="explanation"><strong>Hint/Explain:</strong> ${item.explanation}</div>`;
                
                itemDiv.innerHTML = html;
                card.appendChild(itemDiv);
            });

            contentDiv.appendChild(card);
        }

        // Notify parent that we are ready
        if (window.opener) {
            window.opener.postMessage({ type: 'HELPER_READY' }, '*');
        }
    </script>
</body>
</html>
