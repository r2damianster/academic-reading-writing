<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Académico</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .dojo-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
            border-radius: 0;
        }
        .dojo-header h1 { font-weight: 700; margin: 0; }
        .dojo-header p { margin: 10px 0 0; opacity: 0.9; }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .series-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .series-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            border-color: #667eea;
        }

        .series-icon { font-size: 48px; margin-bottom: 12px; }
        .series-card h3 { font-size: 1.3rem; font-weight: 600; margin-bottom: 8px; }
        .series-card p { color: #666; font-size: 0.95rem; margin: 0; }

        .leaderboard-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 40px;
        }

        .leaderboard-card h2 { font-weight: 700; margin-bottom: 20px; font-size: 1.5rem; }

        .leaderboard-rank {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .leaderboard-rank:last-child { border-bottom: none; }

        .rank-pos {
            font-weight: 700;
            font-size: 1.2rem;
            width: 40px;
            text-align: center;
        }

        .rank-pos.gold { color: #ffd700; }
        .rank-pos.silver { color: #c0c0c0; }
        .rank-pos.bronze { color: #cd7f32; }

        .rank-info { flex: 1; margin: 0 16px; }
        .rank-name { font-weight: 600; }
        .rank-points { color: #667eea; font-weight: 700; }

        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff3cd;
            color: #856404;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .loading { text-align: center; padding: 40px; color: #999; }
        .error { background: #f8d7da; color: #721c24; padding: 16px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="dojo-header">
    <div class="container">
        <h1>🥋 Dojo Académico</h1>
        <p>Master writing through guided exercises and challenges</p>
        <div class="mt-3" id="streakBadge"></div>
    </div>
</div>

<div class="container">

    <!-- Leaderboard 24h Modal (populates dynamically) -->
    <div class="modal fade" id="leaderboardModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🏆 Course Leaderboard</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="leaderboardModalBody">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Think Shortcut -->
    <div style="margin-bottom: 30px;">
        <h3 style="font-weight: 700; margin-bottom: 16px;">⚡ Quick Challenges</h3>
        <div class="series-grid" id="quickThinkContainer"></div>
    </div>

    <!-- Series Grid -->
    <h3 style="font-weight: 700; margin-bottom: 16px; margin-top: 30px;">📚 Learning Series</h3>
    <div id="seriesContainer" class="series-grid loading">
        <div class="loading">Loading Dojo series...</div>
    </div>

    <!-- Leaderboard Card (always visible) -->
    <div class="leaderboard-card">
        <h2>📊 Your Course Standings</h2>
        <div id="leaderboardStandingsContainer" class="loading">Loading...</div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="js/dojo-client.js?v=1.2"></script>

<script>
(async function() {
    // Get studentId from parent window or direct
    if (!window.currentStudent && window.parent && window.parent.currentStudent) {
        window.currentStudent = window.parent.currentStudent;
    }

    await dojoClient.init();

    // ─── Load QuickThink Sets (internal) ───
    async function _loadQuickThinkSets() {
        const container = document.getElementById('quickThinkContainer');
        try {
            const result = await dojoClient.getQuickThinkSets();
            if (result.error || !result.sets) {
                container.innerHTML = '';
                return;
            }

            // Show every set — the pool now spans 12 topics
            const { sets = [] } = result;
            container.innerHTML = sets.map(s => `
                <div class="series-card" onclick="loadQuickThink('${s.set_id}')">
                    <div class="series-icon">⚡</div>
                    <h3>${s.name}</h3>
                    <p>${s.description}</p>
                    <small style="color:#999;">${s.total_questions} questions • ${s.time_limit_per_q}s each${
                        s.pool_size ? ` • drawn from ${s.pool_size}` : ''
                    }</small>
                </div>
            `).join('');
        } catch (e) {
            console.error('❌ QT load:', e);
        }
    }

    // ─── Load Series Grid ───
    async function loadSeries() {
        const container = document.getElementById('seriesContainer');
        try {
            console.log('📚 Loading series. StudentID:', dojoClient.studentId);
            const result = await dojoClient.getDojoSeries();
            console.log('📚 Series result:', result);
            if (result.error) {
                console.error('❌ Series error:', result.error);
                container.innerHTML = `<div class="error">Failed to load series: ${result.error}. Try refreshing.</div>`;
                return;
            }

            const { series = [], studentProgress = {} } = result;
            container.innerHTML = series.map(s => `
                <div class="series-card" onclick="loadSeriesTopics('${s.series_id}')">
                    <div class="series-icon">${s.icon || '📚'}</div>
                    <h3>${s.name}</h3>
                    <p>${s.description}</p>
                    <small style="color:#999;">Est. ${s.estimated_time_hours}h</small>
                </div>
            `).join('');

            // Update streak badge
            if (studentProgress) {
                document.getElementById('streakBadge').innerHTML = `
                    <div class="streak-badge">
                        ⚡ ${studentProgress.currentStreak || 0} days streak
                    </div>
                `;
            }
        } catch (e) {
            console.error('❌ Series load:', e);
            container.innerHTML = '<div class="error">Error loading series.</div>';
        }
    }

    // ─── Leaderboard 24h Logic ───
    async function checkLeaderboard() {
        const { show, data } = await dojoClient.showLeaderboardIfEligible();
        if (show && data?.topStudents) {
            populateLeaderboardModal(data);
            new bootstrap.Modal(document.getElementById('leaderboardModal')).show();
        }

        // Also populate standings card
        await loadLeaderboardStandings();
    }

    async function loadLeaderboardStandings() {
        const container = document.getElementById('leaderboardStandingsContainer');
        try {
            const result = await dojoClient.getLeaderboard();
            if (result.error) {
                container.innerHTML = '<div class="text-muted">Leaderboard unavailable.</div>';
                return;
            }

            const { studentRank = 0, topStudents = [], totalInCourse = 0 } = result;
            container.innerHTML = `
                <div style="margin-bottom: 20px; padding: 16px; background: #f0f4ff; border-radius: 8px;">
                    <div style="font-size: 0.9rem; color: #666;">Your rank in ${totalInCourse} students</div>
                    <div style="font-size: 2rem; font-weight: 700; color: #667eea;">#${studentRank}</div>
                </div>
                <div>
                    <h6 style="font-weight: 700; margin-bottom: 12px;">Top Performers</h6>
                    ${topStudents.map((s, i) => {
                        const posClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                        return `
                            <div class="leaderboard-rank">
                                <div class="rank-pos ${posClass}">${i + 1}</div>
                                <div class="rank-info">
                                    <div class="rank-name">Student ${s.student_id?.slice(0, 8)}...</div>
                                    <div style="font-size: 0.85rem; color: #999;">Streak: ${s.current_streak || 0}d</div>
                                </div>
                                <div class="rank-points">${s.total_series_points || 0} pts</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        } catch (e) {
            console.error('❌ Leaderboard load:', e);
            container.innerHTML = '<div class="error">Failed to load leaderboard.</div>';
        }
    }

    function populateLeaderboardModal(data) {
        const { topStudents = [] } = data;
        const body = document.getElementById('leaderboardModalBody');
        body.innerHTML = topStudents.map((s, i) => {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
            return `
                <div style="padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-weight: 700; font-size: 1.1rem;">${medal} Rank #${i + 1}</div>
                        <small style="color: #999;">Streak: ${s.current_streak || 0} days</small>
                    </div>
                    <div style="font-weight: 700; color: #667eea; font-size: 1.2rem;">${s.total_series_points || 0}</div>
                </div>
            `;
        }).join('');
    }

    // ─── Global functions for navigation ───
    window.loadSeriesTopics = function(seriesId) {
        const sid = dojoClient.studentId || localStorage.getItem('studentId');
        const url = 'dojo-series.html?series=' + encodeURIComponent(seriesId) +
                    '&studentId=' + encodeURIComponent(sid);
        console.log('🔗 Navigating to series:', url);
        window.location.href = url;
    };

    window.loadQuickThink = function(setId) {
        const sid = dojoClient.studentId || localStorage.getItem('studentId');
        const url = 'dojo-quick-think.html?set=' + encodeURIComponent(setId) +
                    '&studentId=' + encodeURIComponent(sid);
        console.log('🔗 Navigating to QuickThink:', url);
        window.location.href = url;
    };

    // ─── Init ───
    await _loadQuickThinkSets();
    await loadSeries();
    await checkLeaderboard();
})();
</script>

</body>
</html>
