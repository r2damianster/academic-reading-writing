<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Think</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .qt-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-bottom: 20px;
        }

        .qt-progress {
            background: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .progress-text { font-weight: 600; color: #667eea; }
        .timer {
            font-size: 1.3rem;
            font-weight: 700;
            color: #667eea;
            padding: 8px 12px;
            background: #f0f4ff;
            border-radius: 6px;
        }
        .timer.warning { color: #ff9800; background: #fff3cd; }
        .timer.danger { color: #f44336; background: #f8d7da; }

        .qt-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 800px;
            margin: 0 auto 40px;
        }

        .question-number { font-size: 0.9rem; color: #999; margin-bottom: 8px; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f8f9fa;
            border: 2px solid #ddd;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .option.selected {
            background: #e8ebff;
            border-color: #667eea;
            font-weight: 600;
        }
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            cursor: default;
        }
        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            cursor: default;
        }

        .explanation {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.9rem;
            display: none;
        }
        .explanation.show { display: block; }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
        }
        .btn-secondary, .btn-primary {
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5568d3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

        .results {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }
        .results.show { display: block; }

        .score-big { font-size: 3rem; font-weight: 700; color: #667eea; margin: 20px 0; }
        .results-text { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .loading { text-align: center; padding: 40px; color: #999; }
        .error { background: #f8d7da; color: #721c24; padding: 16px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="qt-header">
    <div class="container">
        <button class="back-btn" onclick="history.back()">← Back</button>
    </div>
</div>

<div class="container">
    <div id="progressBar"></div>
    <div id="qtContainer" class="loading">Loading Quick Think...</div>
    <div id="resultsContainer"></div>
</div>

<script src="js/dojo-client.js?v=1.0"></script>

<script>
let QT_SETS_MAP = {};

async function loadQTSetsMap() {
    try {
        const response = await fetch('/data/dojo/quick-think.json');
        const sets = await response.json();
        sets.forEach(set => {
            QT_SETS_MAP[set.set_id] = set;
        });
    } catch (e) {
        console.warn('⚠️ QT sets load:', e);
    }
}

(async function() {
    const params = new URLSearchParams(window.location.search);
    const setId = params.get('set');

    if (!setId) {
        document.getElementById('qtContainer').innerHTML = '<div class="error">Set ID not found.</div>';
        return;
    }

    await dojoClient.init();
    await loadQTSetsMap();

    const set = QT_SETS_MAP[setId];

    if (!set || !set.questions || set.questions.length === 0) {
        document.getElementById('qtContainer').innerHTML = '<div class="error">Quick Think set not found.</div>';
        return;
    }

    let currentQuestionIdx = 0;
    let answers = [];
    let questionStartTime = Date.now();
    let timerInterval = null;
    let sessionStartTime = Date.now();

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
        const html = `
            <div class="qt-progress">
                <div class="progress-text">Question ${currentQuestionIdx + 1} of ${set.total_questions}</div>
                <div class="timer" id="timer">${formatTime(set.time_limit_per_q)}</div>
            </div>
        `;
        document.getElementById('progressBar').innerHTML = html;
    }

    function startQuestionTimer() {
        clearInterval(timerInterval);
        questionStartTime = Date.now();
        const limitMs = set.time_limit_per_q * 1000;

        timerInterval = setInterval(() => {
            const elapsed = Date.now() - questionStartTime;
            const remaining = limitMs - elapsed;
            const remainingSecs = Math.ceil(remaining / 1000);

            const timerEl = document.getElementById('timer');
            if (!timerEl) {
                clearInterval(timerInterval);
                return;
            }

            timerEl.textContent = formatTime(Math.max(0, remainingSecs));
            timerEl.parentElement.classList.remove('warning', 'danger');

            if (remainingSecs <= 10) {
                timerEl.parentElement.classList.add('warning');
            }
            if (remainingSecs <= 5) {
                timerEl.parentElement.classList.add('danger');
            }
        }, 100);
    }

    function showQuestion(idx) {
        const q = set.questions[idx];
        if (!q) return;

        updateProgress();

        const optionsHtml = q.options.map((opt, optIdx) => `
            <div class="option" id="opt-${optIdx}" onclick="selectOption(${optIdx})">
                ${opt.text}
            </div>
        `).join('');

        const html = `
            <div class="qt-container">
                <div class="question-number">Question ${idx + 1}</div>
                <div class="question-text">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="explanation"></div>
                <div class="buttons">
                    ${idx > 0 ? '<button class="btn-secondary" onclick="prevQuestion()">← Previous</button>' : '<div></div>'}
                    ${idx < set.total_questions - 1 ? '<button class="btn-primary" id="nextBtn" disabled onclick="nextQuestion()">Next →</button>' : '<button class="btn-primary" id="submitBtn" onclick="submitQuickThink()">Submit & Score</button>'}
                </div>
            </div>
        `;

        document.getElementById('qtContainer').innerHTML = html;
        startQuestionTimer();

        // Restore selected answer if exists
        if (answers[idx] !== undefined) {
            document.getElementById(`opt-${answers[idx]}`)?.classList.add('selected');
            showFeedback(idx);
        }
    }

    function showFeedback(idx) {
        const q = set.questions[idx];
        if (answers[idx] === undefined) return;

        const isCorrect = answers[idx] === q.correct_index;
        document.getElementById(`opt-${answers[idx]}`)?.classList.add(isCorrect ? 'correct' : 'incorrect');

        if (q.explanation) {
            const expEl = document.getElementById('explanation');
            expEl.innerHTML = `<strong>${isCorrect ? '✅ Correct!' : '❌ Incorrect'}</strong> — ${q.explanation}`;
            expEl.classList.add('show');
        }

        if (idx < set.total_questions - 1) {
            document.getElementById('nextBtn').disabled = false;
        } else {
            document.getElementById('submitBtn').disabled = false;
        }
    }

    window.selectOption = function(optIdx) {
        // Deselect prev
        document.querySelectorAll('.option').forEach(el => el.classList.remove('selected', 'correct', 'incorrect'));
        document.getElementById(`opt-${optIdx}`).classList.add('selected');

        answers[currentQuestionIdx] = optIdx;
        showFeedback(currentQuestionIdx);
    };

    window.nextQuestion = function() {
        if (currentQuestionIdx < set.total_questions - 1) {
            currentQuestionIdx++;
            showQuestion(currentQuestionIdx);
        }
    };

    window.prevQuestion = function() {
        if (currentQuestionIdx > 0) {
            currentQuestionIdx--;
            showQuestion(currentQuestionIdx);
        }
    };

    window.submitQuickThink = async function() {
        clearInterval(timerInterval);
        const timeSpentSeconds = Math.round((Date.now() - sessionStartTime) / 1000);

        try {
            const result = await dojoClient.submitQuickThink(setId, answers, timeSpentSeconds);

            if (result.error) throw result;

            const { correctCount, totalQuestions, points, score } = result;

            const resultsHtml = `
                <div class="results show">
                    <h2>📊 Results</h2>
                    <div class="score-big">${correctCount}/${totalQuestions}</div>
                    <div class="results-text">You got ${score}% correct!</div>
                    <div style="background: #f0f4ff; padding: 16px; border-radius: 8px; margin: 20px 0;">
                        <div style="color: #667eea; font-weight: 700; font-size: 1.3rem;">+${points} points</div>
                        <small style="color: #666;">Quick Think Bonus</small>
                    </div>
                    <button class="btn-primary" onclick="history.back()" style="margin-top: 20px;">← Back to Dojo</button>
                </div>
            `;

            document.getElementById('qtContainer').innerHTML = '';
            document.getElementById('progressBar').innerHTML = '';
            document.getElementById('resultsContainer').innerHTML = resultsHtml;

            dojoClient.recordActivity();

        } catch (e) {
            console.error('❌ Submit failed:', e);
            alert('Failed to submit. ' + (e.offline ? 'Saved offline.' : 'Try again.'));
        }
    };

    showQuestion(0);

})();
</script>

</body>
</html>
